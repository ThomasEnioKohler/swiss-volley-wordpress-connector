name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: PHP ${{ matrix.php }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Syntaxcheck
        run: |
          find volleyball-schedules-for-swiss-volley -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Lint OK"

      - name: Tests
        run: php -d error_reporting=E_ALL -d display_errors=1 tests/harness.php

  # Eigener Job statt Schritt in der PHP-Matrix: Die Shell-Tests hängen
  # nicht von der PHP-Version ab und sollen nicht dreimal identisch laufen.
  version-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Versionskonsistenz
        run: bash bin/version.sh

      - name: readme.txt gegen CHANGELOG.md prüfen
        run: bash bin/sync-readme-changelog.sh --check

      - name: Tests der Versions-Werkzeuge
        run: bash tests/test-version-tools.sh

      - name: Tests der Build-Pipeline
        run: bash tests/test-build.sh

      - name: i18n-Prüfungen
        run: bash tests/test-i18n.sh

      - name: Build (Lint, Tests, POT, ZIP)
        run: bash bin/build.sh

  # WordPress Coding Standards: dieselben Regeln, die das offizielle
  # Plugin-Check-Plugin bei der Einreichung auf wordpress.org prüft.
  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr, composer

      - name: WordPress Coding Standards installieren
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:^3 dealerdirect/phpcodesniffer-composer-installer

      - name: PHPCS
        run: ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist --report=full
