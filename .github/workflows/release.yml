name: Release

# Prüft den Tag gegen die Versionsangaben in den Dateien, baut das
# installierbare ZIP und veröffentlicht beides als GitHub-Release,
# sobald ein Tag der Form v0.1.7 gepusht wird.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Auf Job-Ebene gesetzt, damit der "if" des Deploy-Schritts weiter unten
    # den Wert sehen kann: env, das ein Schritt sich selbst mitgibt, steht
    # dessen eigener "if"-Auswertung nicht zur Verfügung (die Bedingung wird
    # ausgewertet, bevor der Schritt seinen eigenen env-Block anwendet).
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # msgfmt und msgcmp sind auf ubuntu-latest nicht vorinstalliert;
      # bin/build.sh braucht beide für die Kataloge und die i18n-Prüfung.
      - name: gettext einrichten
        run: sudo apt-get update && sudo apt-get install -y gettext

      # Läuft bewusst vor dem Build: Ein falsch gesetzter Tag soll in
      # Sekunden scheitern, nicht nach der kompletten Testsuite.
      - name: Tag gegen die Versionsangaben prüfen
        run: |
          VERSION="$(bash bin/version.sh --expect "${GITHUB_REF_NAME#v}")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build (Lint, Tests, POT, ZIP)
        run: bash bin/build.sh

      - name: Release-Notes aus CHANGELOG.md
        run: bash bin/release-notes.sh "$VERSION" > release-notes.md

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/volleyball-schedules-for-swiss-volley-*.zip
          fail_on_unmatched_files: true
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.VERSION, '0.') }}

      # Laeuft nur, wenn die SVN-Zugangsdaten hinterlegt sind. Vor der
      # Freigabe durch das Plugin-Team existiert kein SVN-Repository,
      # der Schritt wird dann uebersprungen statt fehlzuschlagen.
      - name: WordPress.org Deploy
        if: ${{ env.SVN_USERNAME != '' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: volleyball-schedules-for-swiss-volley
          BUILD_DIR: dist/build/volleyball-schedules-for-swiss-volley
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ env.VERSION }}
